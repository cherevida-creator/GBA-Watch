name: Apple platform builds

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build Apple Watch app
        run: >-
          xcodebuild
          -project GBAWatch.xcodeproj
          -scheme GBAWatch
          -destination 'generic/platform=watchOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build iPhone companion
        run: >-
          xcodebuild
          -project GBAWatch.xcodeproj
          -scheme GBACompanion
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Upload simulator apps
        uses: actions/upload-artifact@v4
        with:
          name: gba-watch-simulator-build
          path: |
            build/Build/Products/Debug-watchsimulator/GBAWatch.app
            build/Build/Products/Debug-iphonesimulator/GBACompanion.app
          if-no-files-found: error
          retention-days: 14
